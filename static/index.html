<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101816">
<title>Zero W // Snake</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#101816;color:#e4f5eb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(100%,560px)}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:clamp(24px,6vw,40px);letter-spacing:-2px}small,.muted{color:#85a99a}
.stats{display:flex;gap:18px;text-align:right}.stats strong{display:block;font-size:22px;color:#bcff99}
.board{position:relative;aspect-ratio:1;border:1px solid #416552;background:#192921;box-shadow:0 16px 50px #0005}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#0b1615dc;text-align:center}
.overlay[hidden]{display:none}.overlay h2{font-size:28px;margin:0}.overlay p{margin:0;color:#abc4b5;padding:0 15px}
button{font:inherit;color:#101816;background:#bcff99;border:0;border-radius:5px;padding:12px 22px;cursor:pointer;font-weight:700}
button:focus-visible{outline:3px solid white;outline-offset:3px}
footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:16px}
.controls{display:grid;grid-template-columns:repeat(3,58px);gap:5px;justify-content:center;margin-top:20px;touch-action:none}
.controls button{padding:12px 0;background:#254b39;color:#e8ffef;font-size:20px;user-select:none}
.controls button[data-dir=up]{grid-column:2}.controls button[data-dir=left]{grid-column:1}.controls button[data-dir=down]{grid-column:2}.controls button[data-dir=right]{grid-column:3}
@media(min-width:650px){.controls{display:none}}
</style>
</head>
<body>
<main>
<header><div><small>RASPBERRY PI ZERO W / ARCADE</small><h1>SNAKE<span style="color:#bcff99">_</span></h1></div><div class="stats"><div><small>SCORE</small><strong id="score">0</strong></div><div><small>BEST</small><strong id="best">0</strong></div></div></header>
<div class="board">
<canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas>
<div class="overlay" id="overlay"><h2 id="headline">READY?</h2><p id="description">Eat the green fruit. Avoid walls and yourself.</p><button id="start">START GAME</button></div>
</div>
<footer><small>ARROWS / WASD TO MOVE · SPACE TO PAUSE</small><button id="pause">PAUSE</button></footer>
<div class="controls" aria-label="Touch direction controls"><button data-dir="up" aria-label="Up">↑</button><button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button></div>
</main>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
const overlay=document.getElementById("overlay"),headline=document.getElementById("headline"),description=document.getElementById("description");
const N=20,S=canvas.width/N;
let snake,food,dir,nextDir,score=0,best=0,mode="ready",timer=null;
try{best=Number(localStorage.getItem("zerow-snake-best"))||0}catch(e){}
bestEl.textContent=best;
function randFood(){
 const free=[];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});
 return free.length?free[Math.floor(Math.random()*free.length)]:null;
}
function draw(){
 ctx.fillStyle="#192921";ctx.fillRect(0,0,480,480);
 ctx.strokeStyle="#274034";ctx.lineWidth=1;
 for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,480);ctx.moveTo(0,i*S);ctx.lineTo(480,i*S);ctx.stroke();}
 if(food){ctx.fillStyle="#edb96d";ctx.beginPath();ctx.arc((food.x+.5)*S,(food.y+.5)*S,S*.34,0,Math.PI*2);ctx.fill();}
 snake.forEach((p,i)=>{ctx.fillStyle=i===0?"#bcff99":"#69c994";ctx.fillRect(p.x*S+2,p.y*S+2,S-4,S-4);});
}
function show(title,message,action){headline.textContent=title;description.textContent=message;document.getElementById("start").textContent=action;overlay.hidden=false;}
function stopTimer(){if(timer!==null){clearInterval(timer);timer=null;}}
function reset(){
 stopTimer();snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir={...dir};
 score=0;scoreEl.textContent=score;food=randFood();mode="playing";overlay.hidden=true;
 document.getElementById("pause").textContent="PAUSE";draw();timer=setInterval(tick,125);
}
function end(message){stopTimer();mode="ended";show(message,"Final score: "+score,"PLAY AGAIN");}
function tick(){
 dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 const eating=food&&head.x===food.x&&head.y===food.y;
 const body=eating?snake:snake.slice(0,-1);
 if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){end("GAME OVER");return;}
 snake.unshift(head);if(!eating)snake.pop();
 else{
  score+=10;scoreEl.textContent=score;
  if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem("zerow-snake-best",String(best))}catch(e){}}
  food=randFood();if(!food){draw();end("YOU WIN");return;}
 }
 draw();
}
function turn(x,y){if(mode!=="playing")return;if(x===-dir.x&&y===-dir.y)return;nextDir={x,y};}
function pause(){
 if(mode==="playing"){stopTimer();mode="paused";show("PAUSED","Press resume or space to continue.","RESUME");document.getElementById("pause").textContent="RESUME";}
 else if(mode==="paused"){mode="playing";overlay.hidden=true;document.getElementById("pause").textContent="PAUSE";timer=setInterval(tick,125);}
}
document.getElementById("start").addEventListener("click",()=>mode==="paused"?pause():reset());
document.getElementById("pause").addEventListener("click",pause);
const dirs={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
window.addEventListener("keydown",e=>{
 if(dirs[e.code]){e.preventDefault();turn(...dirs[e.code]);}
 if(e.code==="Space"){e.preventDefault();if(mode==="ready"||mode==="ended")reset();else pause();}
});
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();const v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];turn(...v);}));
let touch=null;canvas.addEventListener("touchstart",e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
canvas.addEventListener("touchend",e=>{if(!touch)return;const x=e.changedTouches[0].clientX-touch[0],y=e.changedTouches[0].clientY-touch[1];if(Math.max(Math.abs(x),Math.abs(y))>25)turn(Math.abs(x)>Math.abs(y)?Math.sign(x):0,Math.abs(y)>=Math.abs(x)?Math.sign(y):0);touch=null},{passive:true});
snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:14,y:10};draw();
</script>
</body>
</html>
